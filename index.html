<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Weather App</title>

    <!-- Mobile App Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#60A5FA">

    <!-- Inline Web App Manifest to force native fullscreen on Home Screen -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIldlYXRoZXIgQXBwIiwKICAic2hvcnRfbmFtZSI6ICJXZWF0aGVyIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiM2MEE1RkEiLAogICJ0aGVtZV9jb2xvciI6ICIjNjBBNUZBIgogfQ==">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #60A5FA;
            font-family: 'Inter', sans-serif;
        }

        /* Fixed backdrop guarantees blue covers full screen regardless of scrolling */
        .app-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center p-4">
    <div class="app-bg bg-gradient-to-br from-blue-400 to-indigo-600"></div>

    <div id="root" class="w-full flex justify-center items-center"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const API_KEY = "6189ec56d869849606d02e0546fb3b97";
        const BASE_URL = "https://api.openweathermap.org/data/2.5/weather";

        const SECRET_REDIRECTS = {
            'nextile': 'https://guns.lol/nextile',
            'socials': 'https://guns.lol/nextile'
        };

        const { useState } = React;

        const App = () => {
            const [city, setCity] = useState('');
            const [weatherData, setWeatherData] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleFormSubmit = async (e) => {
                e.preventDefault();
                const trimmedInput = city.trim().toLowerCase();

                if (!trimmedInput) {
                    setError('Please enter a city name.');
                    return;
                }

                if (SECRET_REDIRECTS[trimmedInput]) {
                    window.open(SECRET_REDIRECTS[trimmedInput], '_blank');
                    setCity('');
                    setError(null);
                    return;
                }

                fetchWeatherByUrl(`${BASE_URL}?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`);
            };

            const handleLocationSearch = () => {
                if (!navigator.geolocation) {
                    setError('Geolocation is not supported by your browser.');
                    return;
                }

                setIsLoading(true);
                setError(null);

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        fetchWeatherByUrl(`${BASE_URL}?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`);
                    },
                    (err) => {
                        setIsLoading(false);
                        setError('Unable to retrieve your location. Please check browser permissions.');
                    }
                );
            };

            const fetchWeatherByUrl = async (url) => {
                setIsLoading(true);
                setError(null);
                setWeatherData(null);

                try {
                    const response = await fetch(url);
                    
                    if (response.status === 404) {
                        setError('City not found. Please check the spelling.');
                    } else if (response.status === 401) {
                        setError('Invalid API key. Please check your API key.');
                    } else if (!response.ok) {
                        setError(`An unexpected error occurred with status code: ${response.status}`);
                    } else {
                        const data = await response.json();
                        setWeatherData(data);
                    }
                } catch (err) {
                    setError('A network error occurred. Please try again.');
                } finally {
                    setIsLoading(false);
                }
            };

            const WeatherCard = ({ title, value, unit, icon }) => (
                <div className="bg-gray-100 p-4 rounded-xl shadow-lg flex flex-col items-center">
                    <div className="text-gray-500 mb-2">
                        {icon}
                    </div>
                    <div className="text-2xl font-bold text-gray-800">{value}{unit}</div>
                    <div className="text-sm font-medium text-gray-600 text-center">{title}</div>
                </div>
            );

            const icons = {
                search: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
                location: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
                sun: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
                cloud: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 16H8a6 6 0 0 1 0-12"/></svg>,
                droplet: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.32 0z"/></svg>,
                wind: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.73 21a2 2 0 1 0 0-4H5.27a2 2 0 1 0 0 4z"/><path d="M11 13a4 4 0 0 0-4-4H2"/><path d="M19 9a2 2 0 1 0 0-4H5.27a2 2 0 1 0 0 4z"/></svg>,
                alert: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            };

            return (
                <div className="w-full max-w-xl bg-white rounded-3xl shadow-2xl p-6 sm:p-8 transform transition-all duration-300">
                    <h1 className="text-3xl sm:text-4xl font-bold text-center text-gray-800 mb-2">Weather App</h1>
                    <p className="text-center text-gray-500 mb-8 text-sm sm:text-base">
                        Enter a city or use your location to get current weather.
                    </p>
                    
                    <form onSubmit={handleFormSubmit} className="flex gap-2">
                        <input
                            type="text"
                            value={city}
                            onChange={(e) => setCity(e.target.value)}
                            placeholder="Enter city name..."
                            className="flex-grow p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm sm:text-base min-w-0"
                        />
                        <button
                            type="button"
                            onClick={handleLocationSearch}
                            title="Use My Location"
                            className="p-3 bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300 rounded-xl shadow-sm transition-colors duration-200 flex items-center justify-center flex-shrink-0"
                            disabled={isLoading}
                        >
                            {icons.location}
                        </button>
                        <button
                            type="submit"
                            className="p-3 bg-blue-600 text-white rounded-xl shadow-md hover:bg-blue-700 transition-colors duration-200 flex items-center justify-center flex-shrink-0"
                            disabled={isLoading}
                        >
                            {isLoading ? (
                                <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            ) : (
                                icons.search
                            )}
                        </button>
                    </form>

                    <div className="mt-8">
                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl relative flex items-center gap-2" role="alert">
                                {icons.alert}
                                <span className="block sm:inline text-sm sm:text-base">{error}</span>
                            </div>
                        )}

                        {weatherData && (
                            <div className="text-center">
                                <h2 className="text-2xl sm:text-3xl font-semibold text-gray-800 mb-4">
                                    {weatherData.name}, {weatherData.sys.country}
                                </h2>
                                
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <WeatherCard 
                                        title="Temperature" 
                                        value={Math.round(weatherData.main.temp)} 
                                        unit="°C" 
                                        icon={icons.sun}
                                    />
                                    <WeatherCard 
                                        title="Condition" 
                                        value={weatherData.weather[0].description.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ')} 
                                        unit="" 
                                        icon={icons.cloud}
                                    />
                                    <WeatherCard 
                                        title="Humidity" 
                                        value={weatherData.main.humidity} 
                                        unit="%" 
                                        icon={icons.droplet}
                                    />
                                    <WeatherCard 
                                        title="Wind Speed" 
                                        value={weatherData.wind.speed} 
                                        unit=" m/s" 
                                        icon={icons.wind}
                                    />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const domNode = document.getElementById('root');
        const root = ReactDOM.createRoot(domNode);
        root.render(React.createElement(App, null));
    </script>
</body>
</html>
